; GTK 3 reads this file directly when no XSettings manager is running, which is
; exactly the case under dwm. Without it every GTK application - Thunar, Firefox
; dialogs, nm-connection-editor, pavucontrol - comes up in the default light
; Adwaita and glares against a black desktop.
;
; Adwaita, not Adwaita-dark. GTK 3 has no theme by that name: it carries
; Adwaita as a compiled-in resource with a light and a dark stylesheet
; (theme/Adwaita/gtk-contained.css and -dark.css), and /usr/share/themes holds
; only Default and Emacs. Naming Adwaita-dark resolves to nothing, GTK falls
; back to light Adwaita, and prefer-dark then has no dark variant to find - it
; reports the name back unchanged, so the setting looks applied while every
; window stays light. Measured on a clean Arch install: theme_bg_color is
; #F6F5F4 for Adwaita-dark and #353535 for the pair below.
;
; gtk-application-prefer-dark-theme is the only dark switch GTK 3 has; it picks
; the dark stylesheet of whatever gtk-theme-name resolved to.
;
; GTK 4 is not affected and keeps Adwaita-dark in config/gtk-4.0/settings.ini,
; where the name does resolve.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
; Papirus, not Papirus-Dark. Papirus-Dark ships no application icons at all and
; inherits breeze-dark rather than Papirus, so selecting it blanks every icon in
; the bar's app dock and system tray. Papirus is already drawn for dark panels.
gtk-icon-theme-name=Papirus
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintfull
gtk-xft-rgba=rgb
