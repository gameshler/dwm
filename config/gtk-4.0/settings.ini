; GTK 4 ignores gtk-theme-name for libadwaita applications, so the dark switch
; here is gtk-application-prefer-dark-theme. Applications that ask the desktop
; portal instead are covered by the org.gnome.desktop.interface color-scheme key
; that install.sh sets.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
; Papirus-Dark has no application icons; see config/gtk-3.0/settings.ini.
gtk-icon-theme-name=Papirus
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
